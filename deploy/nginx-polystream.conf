# Example nginx server block for Polystream, reverse-proxying tv.domain.ch -> 127.0.0.1:3000.
#
# Install:
#   sudo cp deploy/nginx-polystream.conf /etc/nginx/sites-available/tv.domain.ch
#   sudo ln -s /etc/nginx/sites-available/tv.domain.ch /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain + install a TLS cert with certbot (it edits this file in place to add the
# `listen 443 ssl;` block, ssl_certificate directives, and an HTTP->HTTPS redirect):
#   sudo certbot --nginx -d tv.domain.ch
#
# Everything below is the HTTP (:80) server; certbot adds the HTTPS server itself.

server {
	listen 80;
	listen [::]:80;
	server_name tv.domain.ch;

	# Video responses can be large; don't cap request/response body size.
	client_max_body_size 0;

	location / {
		proxy_pass http://127.0.0.1:3000;

		# HTTP/1.1 + cleared Connection header: required for chunked responses and to
		# avoid nginx defaulting to HTTP/1.0 keepalive-less proxying, which breaks streaming.
		proxy_http_version 1.1;
		proxy_set_header Connection "";

		# Streaming (range requests, HLS segments) must not be buffered by nginx, or
		# playback stalls waiting for a full response before forwarding any bytes.
		proxy_buffering off;
		proxy_request_buffering off;

		# Long-lived connections for video playback / slow clients on weak networks.
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
